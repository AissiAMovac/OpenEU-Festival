<style>
  .festival-nav {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    background-color: #ffffff;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    z-index: 8888;
    display: none;
  }

  .festival-nav__inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 60px;
    height: 56px;
    max-width: 100%;
  }

  .festival-nav__logo {
    font-family: 'Work Sans', sans-serif;
    font-weight: 900;
    font-size: 14px;
    color: #111111;
    text-decoration: none;
    letter-spacing: -0.01em;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .festival-nav__logo span {
    color: #3885FF;
  }

  .festival-nav__links {
    display: flex;
    align-items: center;
    gap: 28px;
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .festival-nav__links li {
    margin: 0;
    padding: 0;
  }

  .festival-nav__links a {
    font-family: 'Work Sans', sans-serif;
    font-weight: 600;
    font-size: 13px;
    color: #333333;
    text-decoration: none;
    letter-spacing: 0.02em;
    transition: color 0.2s ease;
    white-space: nowrap;
  }

  .festival-nav__links a:hover {
    color: #3885FF;
  }

  .festival-nav__cta {
    font-family: 'Work Sans', sans-serif;
    font-weight: 700;
    font-size: 13px;
    color: #ffffff !important;
    background-color: #FF6B85;
    padding: 8px 18px;
    border-radius: 6px;
    text-decoration: none !important;
    white-space: nowrap;
    transition: background-color 0.2s ease;
  }

  .festival-nav__cta:hover {
    background-color: #e8527a !important;
    color: #ffffff !important;
  }

  .festival-nav__hamburger {
    display: none;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
    background: none;
    border: none;
    padding: 4px;
  }

  .festival-nav__hamburger span {
    display: block;
    width: 24px;
    height: 2px;
    background-color: #111111;
  }

  .festival-nav__mobile-menu {
    display: none;
    flex-direction: column;
    background-color: #ffffff;
    padding: 16px 24px 24px;
    border-top: 1px solid #f0f0f0;
  }

  .festival-nav__mobile-menu a {
    font-family: 'Work Sans', sans-serif;
    font-weight: 600;
    font-size: 15px;
    color: #333333;
    text-decoration: none;
    padding: 12px 0;
    border-bottom: 1px solid #f0f0f0;
    transition: color 0.2s ease;
  }

  .festival-nav__mobile-menu a:hover {
    color: #3885FF;
  }

  .festival-nav__mobile-menu a:last-child {
    border-bottom: none;
    color: #FF6B85;
    font-weight: 700;
  }

  @media (max-width: 900px) {
    .festival-nav__links {
      display: none;
    }
    .festival-nav__cta {
      display: none;
    }
    .festival-nav__hamburger {
      display: flex;
    }
    .festival-nav__inner {
      padding: 0 24px;
    }
    .festival-nav__mobile-menu.festival-nav__mobile-menu--open {
      display: flex;
    }
  }
</style>

<nav class="festival-nav" id="festival-nav">
  <div class="festival-nav__inner">
    <a href="#" class="festival-nav__logo">OpenEU <span>Festival</span></a>
    <ul class="festival-nav__links">
      <li><a href="#festival-about">About</a></li>
      <li><a href="#festival-speakers">Speakers</a></li>
      <li><a href="#festival-tracks">Tracks</a></li>
      <li><a href="#festival-agenda">Agenda</a></li>
      <li><a href="#festival-host">Host</a></li>
      <li><a href="#festival-council">Student Council</a></li>
    </ul>
    <a href="#festival-register" class="festival-nav__cta">Register Now →</a>
    <button class="festival-nav__hamburger" id="festival-nav-hamburger" aria-label="Open menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>
  <div class="festival-nav__mobile-menu" id="festival-nav-mobile">
    <a href="#festival-about">About</a>
    <a href="#festival-speakers">Speakers</a>
    <a href="#festival-tracks">Tracks</a>
    <a href="#festival-agenda">Agenda</a>
    <a href="#festival-host">Host</a>
    <a href="#festival-council">Student Council</a>
    <a href="#festival-register">Register Now →</a>
  </div>
</nav>

<script>
(function() {
  var nav = document.getElementById('festival-nav');
  var hamburger = document.getElementById('festival-nav-hamburger');
  var mobileMenu = document.getElementById('festival-nav-mobile');

  nav.style.top = '0px';
  nav.style.display = 'none';

  window.addEventListener('scroll', function() {
    if (window.scrollY > 300) {
      nav.style.display = 'block';
    } else {
      nav.style.display = 'none';
    }
  });

  hamburger.addEventListener('click', function() {
    mobileMenu.classList.toggle('festival-nav__mobile-menu--open');
  });

  document.querySelectorAll('.festival-nav a[href^="#"], .festival-nav__mobile-menu a[href^="#"]').forEach(function(link) {
    link.addEventListener('click', function(e) {
      var target = document.querySelector(this.getAttribute('href'));
      if (target) {
        e.preventDefault();
        var navHeight = nav.offsetHeight;
        var top = target.getBoundingClientRect().top + window.scrollY - navHeight - 16;
        window.scrollTo({ top: top, behavior: 'smooth' });
        mobileMenu.classList.remove('festival-nav__mobile-menu--open');
      }
    });
  });
})();
</script>
