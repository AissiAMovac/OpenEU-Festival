<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  .register-breakout {
    position: relative;
    left: 50%;
    margin-left: -50vw;
    margin-right: -50vw;
    margin-top: -90px;
    width: 100vw;
    background-color: #ffffff;
    padding: 60px;
    box-sizing: border-box;
  }
  .register-breakout__inner {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 80px;
    align-items: center;
  }
  .register-breakout__image-wrap {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .register-breakout__image-wrap img {
    width: 100%;
    height: auto;
    display: block;
  }
  .register-breakout__content h2 {
    font-family: 'Work Sans', sans-serif;
    font-weight: 900;
    font-size: 48px;
    line-height: 1.05;
    color: #111111;
    margin-bottom: 24px;
    text-align: left;
  }
  .register-breakout__content p {
    font-family: 'Work Sans', sans-serif;
    font-size: 15px;
    line-height: 1.65;
    color: #111111;
    margin-bottom: 40px;
    text-align: left;
  }
  .register-breakout__btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background-color: #cccccc;
    color: #ffffff;
    font-family: 'Work Sans', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 22px 48px;
    border-radius: 50px;
    text-decoration: none;
    cursor: not-allowed;
    width: 100%;
    max-width: 500px;
    transition: background-color 0.2s ease;
    position: relative;
  }
  .register-breakout__btn:hover {
    background-color: #bbbbbb;
  }
  .register-breakout__btn-wrap {
    position: relative;
    display: inline-block;
    width: 100%;
    max-width: 500px;
  }
  .register-breakout__tooltip {
    visibility: hidden;
    opacity: 0;
    background-color: #111111;
    color: #ffffff;
    font-family: 'Work Sans', sans-serif;
    font-size: 12px;
    font-weight: 600;
    text-align: center;
    padding: 8px 14px;
    border-radius: 4px;
    position: absolute;
    bottom: calc(100% + 8px);
    left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
    transition: opacity 0.2s ease;
    z-index: 10;
  }
  .register-breakout__tooltip::after {
    content: '';
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    border: 5px solid transparent;
    border-top-color: #111111;
  }
  .register-breakout__btn-wrap:hover .register-breakout__tooltip {
    visibility: visible;
    opacity: 1;
  }
  @media (max-width: 768px) {
    .register-breakout {
      padding: 40px 24px 80px 24px;
      overflow: visible;
    }
    .register-breakout__inner {
      grid-template-columns: 1fr;
      gap: 24px;
    }
    .register-breakout__content h2 {
      font-size: 32px;
    }
    .register-breakout__btn {
      max-width: 100%;
    }
    .register-breakout__btn-wrap {
      max-width: 100%;
    }
  }
</style>
<section class="register-breakout" id="festival-register">
  <div class="register-breakout__inner">
    <div class="register-breakout__image-wrap">
      <img
        src="https://storage-8.saas.pokecode.net/fev5aqk96h4b3jk4xw5xqc3rjc34"
        alt="Festival registration illustration"
      />
    </div>
    <div class="register-breakout__content">
      <h2>Festival Registration</h2>
      <p>Secure your spot at the festival online sessions. Membership is open to all university students and staff from the OpenEU Alliance.</p>
      <div class="register-breakout__btn-wrap">
        <span class="register-breakout__tooltip">Registration coming soon!</span>
        <a href="#" class="register-breakout__btn" onclick="return false;">
          Register Now ↗
        </a>
      </div>
    </div>
  </div>
</section>
